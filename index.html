<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Instagram Login Clone</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="page">

            
            <section class="phone-preview">

                <div class="phone">
                   

                    <div class="phone-screen">
                        

                        <div class="story-circle"></div>
                        

                        <div class="post-box"></div>
                        

                        <div class="post-lines"></div>
                        
                    </div>

                </div>

            </section>

           
            <section class="login-area">

                <div class="login-box">
                    

                    <h1 class="logo">Instagram</h1>

                    <form class="login-form">
                        <input type="text" placeholder="Phone number, username, or email">

                        <input type="password" placeholder="Password">

                        <button type="submit">Log in</button>
                    </form>

                    <div class="divider">
                        <span></span>

                        <p>OR</p>

                        <span></span>
                    </div>

                    <a class="facebook-login" href="#">Log in with Facebook</a>

                    <a class="forgot-password" href="#">Forgot password?</a>
                </div>

                <div class="signup-box">
                    <p>Don't have an account? <a href="#">Sign up</a></p>
                </div>

                <div class="apps">
                    <p>Get the app.</p>

                    <div class="app-buttons">
                        <div class="app-btn">App Store</div>

                        <div class="app-btn">Google Play</div>
                    </div>
                </div>
<!-- update -->
            </section>

        </main>
    </body>
</html>
